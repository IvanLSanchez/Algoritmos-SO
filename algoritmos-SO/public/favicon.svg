<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#g)"/>
  <!-- Barras estilo diagrama de Gantt -->
  <rect x="10" y="14" width="26" height="8" rx="3" fill="#fff" opacity="0.95"/>
  <rect x="22" y="28" width="32" height="8" rx="3" fill="#fff" opacity="0.75"/>
  <rect x="14" y="42" width="20" height="8" rx="3" fill="#fff" opacity="0.55"/>
  <!-- Engranaje -->
  <g transform="translate(44,44)" fill="#fff">
    <circle r="7.5"/>
    <g id="t">
      <rect x="-2" y="-12.5" width="4" height="5" rx="1.2"/>
    </g>
    <use href="#t" transform="rotate(45)"/>
    <use href="#t" transform="rotate(90)"/>
    <use href="#t" transform="rotate(135)"/>
    <use href="#t" transform="rotate(180)"/>
    <use href="#t" transform="rotate(225)"/>
    <use href="#t" transform="rotate(270)"/>
    <use href="#t" transform="rotate(315)"/>
    <circle r="3" fill="url(#g)"/>
  </g>
</svg>
